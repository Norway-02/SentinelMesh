global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "sentinelmesh-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:9090", "api-server:9090"]

  - job_name: "sentinelmesh-scheduler"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:9091", "scheduler:9091"]

  - job_name: "sentinelmesh-operator"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:9092", "operator:9092"]
